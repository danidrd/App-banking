spring:

  mail:
      host: smtp.gmail.com
      port: 587
      username: ${GMAIL_USERNAME}
      password: ${GMAIL_APP_PASSWORD}
      properties:
        mail:
          smtp:
            auth: true
            starttls:
              enable: true

  application:
    name: budget-app-backend

  datasource:
    url: jdbc:postgresql://localhost:5432/budget_app
    username: budget_user
    password: budget_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    open-in-view: false
    hibernate:
      # Lo schema lo gestisce SOLO Flyway. Hibernate deve solo verificare
      # che le entità corrispondano alle tabelle, mai crearle/modificarle.
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        format_sql: true

  flyway:
    enabled: true
    locations: classpath:db/migration

server:
  port: 8080

logging:
  level:
    org.flywaydb: INFO

app:
    jwt: 
      secret: ${JWT_SECRET:iJj0KwMI2GTM0Nx6nCqU3VfG/rPigXRV8tnUr+5kUiY=}
      expiration-minutes: 60 

    frontend-base-url: http://192.168.1.6:4200

    mail:
      enabled: true