server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Fallback su index.html per qualunque percorso non trovato: necessario
    # perché Angular gestisce il routing lato client (senza, ricaricare
    # /transazioni darebbe 404 invece di mostrare la pagina).
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}