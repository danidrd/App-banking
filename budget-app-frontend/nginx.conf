server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # L'APK cambia ad ogni aggiornamento ma l'URL resta sempre lo stesso:
    # senza queste intestazioni, browser e gestore download di Android
    # possono riusare una copia vecchia già scaricata invece di richiedere
    # quella nuova.
    location /downloads/ {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma "no-cache";
        add_header Expires "0";
    }

    # Le chiamate API restano sotto lo stesso dominio del sito (niente CORS
    # lato browser): nginx le inoltra internamente al container backend.
    location /api/ {
        proxy_pass http://backend:8080/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Fallback su index.html per qualunque percorso non trovato: necessario
    # perché Angular gestisce il routing lato client (senza, ricaricare
    # /transazioni darebbe 404 invece di mostrare la pagina).
    location / {
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
}