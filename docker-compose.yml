services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - budget-net

  backend:
    build: ./budget-app-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      APP_FRONTEND_BASE_URL: https://budget-app.org
      APP_ENABLEBANKING_APPLICATION_ID: ${ENABLEBANKING_APPLICATION_ID}
      APP_ENABLEBANKING_PRIVATE_KEY_PATH: /run/secrets/enablebanking_key.pem
      APP_ENABLEBANKING_BASE_URL: https://api.enablebanking.com
      APP_ENABLEBANKING_BRIDGE_URL: https://api.budget-app.org/api/integration/bridge
      APP_CORS_ALLOWED_ORIGINS: https://budget-app.org
      GMAIL_USERNAME: ${GMAIL_USERNAME}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
    volumes:
      - ./secrets/enablebanking-key.pem:/run/secrets/enablebanking_key.pem:ro
    networks:
      - budget-net

  frontend:
    build: ./budget-app-frontend
    restart: unless-stopped
    volumes:
      - ./apk-downloads:/usr/share/nginx/html/downloads
    networks:
      - budget-net

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel --no-autoupdate run --token ${CLOUDFLARE_TUNNEL_TOKEN}
    networks:
      - budget-net

networks:
  budget-net:
    driver: bridge

volumes:
  postgres-data: